<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>barqr — API reference</title>
<style>
  /* Stock ReDoc, deliberately.
   *
   * The shared barqr theme is NOT injected here and no chrome is added around
   * the widget: ReDoc ships a complete, considered layout, and every attempt
   * to dress it up fought its own stylesheet and lost. The only rules below
   * are the ones needed to give it the full viewport and to render the
   * fetch-failure message, which has to exist because ReDoc cannot report one
   * itself when the spec is fetched on its behalf. */
  html, body { margin: 0; padding: 0; height: 100%; }

  #status {
    max-width: 40rem;
    margin: 4rem auto;
    padding: 0 1.5rem;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    color: #1f1f1f;
  }
  #status h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  #status pre {
    background: #f1f3f4; border-radius: 8px; padding: .75rem 1rem;
    overflow-x: auto; white-space: pre-wrap;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #status a { color: #0b57d0; }
</style>
</head>
<body>

<div id="status" hidden></div>
<div id="redoc"></div>

<script src="/v1/docs/redoc.js"></script>
<script>
(function () {
  "use strict";

  // ReDoc fetches the spec itself and cannot attach a header, so the spec is
  // fetched here with the key and handed over as an object.
  function cookie(name) {
    var parts = document.cookie ? document.cookie.split(";") : [];
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split("=");
      if (kv[0].trim() === name) {
        return decodeURIComponent(kv.slice(1).join("=").trim());
      }
    }
    return "";
  }

  function fail(title, detail, offerUnlock) {
    var el = document.getElementById("status");
    el.hidden = false;
    var h = document.createElement("h1");
    h.textContent = title;
    el.appendChild(h);
    var p = document.createElement("pre");
    p.textContent = detail;
    el.appendChild(p);
    if (offerUnlock) {
      var a = document.createElement("a");
      a.href = "/v1/docs";
      a.textContent = "Enter an API key →";
      el.appendChild(a);
    }
  }

  var headers = {};
  var key = cookie("barqr_key");
  if (key) { headers["X-API-Key"] = key; }

  fetch("/v1/openapi.json", { headers: headers, credentials: "same-origin" })
    .then(function (res) {
      if (res.status === 401 || res.status === 403) {
        throw { unlock: true, message: "The API key is missing or was rejected." };
      }
      if (!res.ok) {
        throw { message: "Fetching /v1/openapi.json returned " + res.status + "." };
      }
      return res.json();
    })
    .then(function (spec) {
      // No theme, no options beyond the scroll target: stock ReDoc.
      Redoc.init(spec, {}, document.getElementById("redoc"));
    })
    .catch(function (err) {
      fail("The API reference could not be loaded",
           (err && err.message) || String(err),
           !!(err && err.unlock));
    });
})();
</script>
</body>
</html>
