<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>barqr — Swagger UI</title>

<!-- The shared theme first, so the chrome below can override the widget's own
     rules rather than the other way round. -->
<style>{{STYLE}}</style>
<style>
/* --- pinned to light -------------------------------------------------------
 *
 * Swagger UI and ReDoc are both light-first designs whose dark handling is
 * poor: their own stylesheets hard-code near-black text and mid-grey rules
 * that are unreadable on a dark surface, and neither exposes enough theming to
 * fix it properly from outside. Rather than ship something that looks broken
 * half the time, these two views are always light.
 *
 * The landing page and the dashboard still follow prefers-color-scheme — they
 * are ours end to end, so they can.
 *
 * These declarations come after the injected theme, so at equal specificity
 * they win over its dark media block.
 * ------------------------------------------------------------------------- */
:root {
  color-scheme: light;

  --md-primary: #0b57d0;
  --md-on-primary: #ffffff;
  --md-primary-container: #d3e3fd;
  --md-on-primary-container: #041e49;
  --md-secondary: #00639b;
  --md-secondary-container: #c2e7ff;
  --md-on-secondary-container: #001d35;
  --md-tertiary: #146c2e;
  --md-tertiary-container: #c4eed0;
  --md-on-tertiary-container: #072711;
  --md-error: #b3261e;
  --md-on-error: #ffffff;
  --md-error-container: #f9dedc;
  --md-on-error-container: #410e0b;
  --md-warning: #a05a00;
  --md-warning-container: #ffdfa8;

  --md-surface: #f8fafd;
  --md-surface-container-lowest: #ffffff;
  --md-surface-container-low: #f0f4f9;
  --md-surface-container: #eaeef6;
  --md-surface-container-high: #e4e9f1;
  --md-surface-container-highest: #dde3ea;
  --md-on-surface: #1f1f1f;
  --md-on-surface-variant: #444746;
  --md-outline: #747775;
  --md-outline-variant: #c4c7c5;
  --md-inverse-surface: #303030;
  --md-inverse-on-surface: #f2f2f2;

  --md-elev-1: 0 1px 2px rgba(0, 0, 0, .3), 0 1px 3px 1px rgba(0, 0, 0, .15);
  --md-elev-2: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 6px 2px rgba(0, 0, 0, .15);
  --md-elev-3: 0 4px 8px 3px rgba(0, 0, 0, .15), 0 1px 3px rgba(0, 0, 0, .3);
}

html, body { background: var(--md-surface); color: var(--md-on-surface); }

select {
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23444746'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
}
</style>
<link rel="stylesheet" href="/v1/docs/swagger-ui.css">

<style>
/* Page chrome only. Swagger UI ships an opinionated stylesheet and fighting it
   rule by rule is a losing game that breaks on every upgrade, so the widget is
   left alone and only the bar above it is themed. */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
  padding: .65rem 1.25rem;
  background: hsl(var(--background));
  border-bottom: 1px solid hsl(var(--border));
}
.topbar .brand {
  font-size: 1.05rem; font-weight: 700; letter-spacing: -.025em;
  text-decoration: none; color: hsl(var(--foreground));
}
.topbar .links { margin-left: auto; display: flex; gap: .4rem; flex-wrap: wrap; }

/* Swagger UI is a light-only widget: its text colour is a fixed dark slate.
   On a dark background that is unreadable, so the container carries its own
   light surface. This paints behind the widget; it does not restyle it. */
#swagger-ui { background: #ffffff; color-scheme: light; }
.swagger-ui .info { margin: 2rem 0 1.5rem; }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">barqr</a>
  <span class="badge">v{{VERSION}}</span>
  <span class="muted small">Swagger UI</span>
  <nav class="links">
    <a class="btn btn-outline btn-sm" href="/">Home</a>
    <a class="btn btn-outline btn-sm" href="/v1/docs">Dashboard</a>
    <a class="btn btn-outline btn-sm" href="/v1/docs/redoc">ReDoc</a>
  </nav>
</header>

<div id="swagger-ui"></div>

<script src="/v1/docs/swagger-ui.js"></script>
<script src="/v1/docs/swagger-preset.js"></script>
<script>
(function () {
  "use strict";

  // A browser cannot attach X-API-Key to a top-level navigation, so the key
  // arrived in a cookie. Reading it back here is the whole reason "Try it out"
  // works without the operator pasting the key a second time into Swagger's
  // own Authorize dialog.
  function cookie(name) {
    var parts = document.cookie ? document.cookie.split("; ") : [];
    for (var i = 0; i < parts.length; i++) {
      var eq = parts[i].indexOf("=");
      if (eq > 0 && decodeURIComponent(parts[i].slice(0, eq)) === name) {
        return decodeURIComponent(parts[i].slice(eq + 1));
      }
    }
    return "";
  }

  var key = cookie("barqr_key");

  // StandaloneLayout brings its own topbar with a spec URL box. This page
  // already has a header, and a second URL field invites pointing the UI at
  // another origin — which the CSP would block anyway, confusingly.
  function HideTopbarPlugin() {
    return { components: { Topbar: function () { return null; } } };
  }

  window.ui = SwaggerUIBundle({
    url: "/v1/openapi.json",
    dom_id: "#swagger-ui",
    deepLinking: true,
    docExpansion: "list",
    defaultModelsExpandDepth: 1,
    tryItOutEnabled: true,
    displayRequestDuration: true,
    // Swagger's own authorisation store would be a second place for the key to
    // live, and a stale one; the interceptor below is the single source.
    persistAuthorization: false,
    presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
    plugins: [SwaggerUIBundle.plugins.DownloadUrl, HideTopbarPlugin],
    layout: "StandaloneLayout",
    // Applies to the spec fetch as well as to every "Try it out" call, so an
    // instance running with BARQR_AUTH_MODE=required renders at all.
    requestInterceptor: function (request) {
      if (key) {
        request.headers["X-API-Key"] = key;
      }
      return request;
    }
  });
})();
</script>
</body>
</html>
