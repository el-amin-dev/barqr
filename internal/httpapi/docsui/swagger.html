<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>barqr — Swagger UI</title>
<link rel="stylesheet" href="/v1/docs/swagger-ui.css">
<style>
  /* Stock Swagger UI, deliberately.
   *
   * The shared barqr theme is NOT injected here and no chrome is added around
   * the widget. Swagger UI ships a complete stylesheet with its own colour
   * language — the green version stamp, the per-verb operation blocks — and
   * anything layered on top fought it and lost: element-level rules for `pre`
   * and `code` leaked into its DOM and flattened exactly those signals.
   *
   * The only rules here are the page reset Swagger UI's own documentation
   * recommends. */
  html { box-sizing: border-box; overflow-y: scroll; }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: #fafafa; }

  #status {
    max-width: 40rem;
    margin: 4rem auto;
    padding: 0 1.5rem;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    color: #1f1f1f;
  }
  #status h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  #status a { color: #0b57d0; }
</style>
</head>
<body>

<div id="status" hidden></div>
<div id="swagger-ui"></div>

<script src="/v1/docs/swagger-ui.js"></script>
<script src="/v1/docs/swagger-preset.js"></script>
<script>
(function () {
  "use strict";

  function cookie(name) {
    var parts = document.cookie ? document.cookie.split(";") : [];
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split("=");
      if (kv[0].trim() === name) {
        return decodeURIComponent(kv.slice(1).join("=").trim());
      }
    }
    return "";
  }

  if (!window.SwaggerUIBundle) {
    var el = document.getElementById("status");
    el.hidden = false;
    el.innerHTML = "";
    var h = document.createElement("h1");
    h.textContent = "Swagger UI could not be loaded";
    el.appendChild(h);
    var a = document.createElement("a");
    a.href = "/v1/docs";
    a.textContent = "Back to the documentation →";
    el.appendChild(a);
    return;
  }

  var key = cookie("barqr_key");

  window.ui = SwaggerUIBundle({
    url: "/v1/openapi.json",
    dom_id: "#swagger-ui",
    presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
    layout: "BaseLayout",
    deepLinking: true,
    docExpansion: "list",
    defaultModelsExpandDepth: 1,
    tryItOutEnabled: true,
    // A browser cannot put the key on the navigation that loaded this page,
    // so it is attached here — to the spec fetch and to every "Try it out"
    // call alike.
    requestInterceptor: function (req) {
      if (key) { req.headers["X-API-Key"] = key; }
      return req;
    }
  });
})();
</script>
</body>
</html>
