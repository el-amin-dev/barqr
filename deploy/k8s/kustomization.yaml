apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything lands in the namespace created by namespace.yaml, so no manifest
# below has to repeat it and an overlay can retarget the whole stack by
# overriding this one line.
namespace: barqr

resources:
  - namespace.yaml
  - deployment.yaml   # Deployment + PodDisruptionBudget
  - service.yaml
  - networkpolicy.yaml
  # secret.example.yaml is deliberately NOT listed. Applying it would install
  # a placeholder API key as a real one. Create the Secret out of band — the
  # file itself documents how.

# The common labels, applied to every object's metadata and to the pod
# template.
#
# `labels:` with includeSelectors:false, NOT `commonLabels:`, and the
# difference is not cosmetic. commonLabels rewrites *selectors* too, and its
# default field list includes a NetworkPolicy's `spec.ingress.from.podSelector`
# — so `commonLabels: {app.kubernetes.io/name: barqr}` silently rewrites the
# client rule in networkpolicy.yaml from
#
#     podSelector: {barqr-client: "true"}
# to
#     podSelector: {barqr-client: "true", app.kubernetes.io/name: barqr,
#                   app.kubernetes.io/instance: barqr}
#
# i.e. "only barqr pods may call barqr", denying every real client. Verified by
# rendering it; `kubectl kustomize` reports no error, the policy simply drops
# the traffic. It would also push the version label into the Deployment's
# immutable spec.selector, so every release would need the Deployment deleted
# and recreated.
#
# The selectors that matter — Service, Deployment, PDB, NetworkPolicy — are
# written out explicitly in their own manifests instead, where they can be read
# next to the thing they select. commonLabels is deprecated in kustomize v5 in
# any case.
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: barqr
      app.kubernetes.io/instance: barqr
      app.kubernetes.io/component: renderer
      app.kubernetes.io/part-of: barqr
      app.kubernetes.io/managed-by: kustomize
      # Bump alongside the image tag below.
      app.kubernetes.io/version: "dev"

images:
  # The single place the image is chosen. An overlay or a CI step can pin a
  # digest without editing the Deployment:
  #   kustomize edit set image barqr=ghcr.io/el-amin-dev/barqr@sha256:<digest>
  # A digest is strictly better than a tag in production: a tag can be moved,
  # a digest cannot.
  - name: barqr
    newName: barqr
    newTag: dev
