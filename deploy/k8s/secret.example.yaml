# EXAMPLE ONLY — this file is not applied.
#
# It is deliberately left out of kustomization.yaml's `resources`. If it were
# listed, `kubectl apply -k` would install the placeholder below as a working
# API key, in every cluster it is applied to, and the deployment would be
# authenticated by a string that is published on GitHub. A key that is in the
# repository is not a key.
#
# Create the real Secret out of band, once per cluster, and let the Deployment
# reference it (see deployment.yaml -> BARQR_API_KEYS -> secretKeyRef):
#
#   kubectl create namespace barqr --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n barqr create secret generic barqr-api-keys \
#     --from-literal=api-keys="$(openssl rand -base64 32)"
#
# `openssl rand -base64 32` gives 256 bits from the system CSPRNG. Do not use a
# password manager's "memorable" generator, a UUID, or anything a human chose:
# barqr compares keys in constant time against a SHA-256 hash, so the only
# thing standing between an attacker and the service is the entropy of the
# string itself.
#
# Rotation without downtime: BARQR_API_KEYS is comma-separated and every key is
# checked, so put both keys in the Secret, roll the consumers onto the new one,
# then remove the old one and restart barqr.
#
#   kubectl -n barqr create secret generic barqr-api-keys \
#     --from-literal=api-keys="$NEW,$OLD" --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n barqr rollout restart deployment/barqr
#
# Note that a Secret is base64, not encryption: anyone with `get secrets` in
# this namespace can read it, and so can anyone with etcd access unless
# encryption at rest is configured. For a real deployment, prefer a Secret
# rendered by External Secrets, Sealed Secrets, SOPS, or your cloud's secret
# store — anything that keeps the plaintext out of both git and etcd.
#
# barqr's own handling of the value is careful: keys are SHA-256 hashed at boot
# and the plaintext is discarded, `barqr check-config` prints
# `BARQR_API_KEYS=<redacted: N key(s)>`, and a test fails the build if a
# plaintext key ever appears in that output.
apiVersion: v1
kind: Secret
metadata:
  name: barqr-api-keys
  namespace: barqr
  labels:
    app.kubernetes.io/name: barqr
    app.kubernetes.io/instance: barqr
    app.kubernetes.io/part-of: barqr
type: Opaque
# stringData rather than data: no base64 step to get wrong by hand. Kubernetes
# encodes it on write.
stringData:
  # REPLACE. Comma-separated for rotation, e.g. "<new-key>,<old-key>".
  api-keys: "REPLACE-ME-WITH-openssl-rand-base64-32-NEVER-COMMIT-A-REAL-KEY"
